<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form - Cafeteria</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .form-body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding-top: 80px;
        }
        .form-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.05);
            text-align: center;
            width: 350px;
        }
        .form-container h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }
        /* Star Rating CSS */
        .stars {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            margin-bottom: 20px;
        }
        .stars input {
            display: none;
        }
        .stars label {
            font-size: 35px;
            color: lightgray;
            padding: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .stars input:checked ~ label,
        .stars label:hover,
        .stars label:hover ~ label {
            color: #FFC107;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .form-group label {
            font-weight: 600;
            color: var(--text-color);
            display: block;
            margin-bottom: 5px;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">Cafeteria</div>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="cart.html">Cart</a>
        <a href="form.html">Feedback Form</a>
    </div>

    <div class="form-body">
        <div class="form-container">
            <h2>Feedback Form</h2>

            <!-- Star Rating -->
            <div class="stars">
                <input type="radio" name="rating" id="star5"><label for="star5">&#9733;</label>
                <input type="radio" name="rating" id="star4"><label for="star4">&#9733;</label>
                <input type="radio" name="rating" id="star3"><label for="star3">&#9733;</label>
                <input type="radio" name="rating" id="star2"><label for="star2">&#9733;</label>
                <input type="radio" name="rating" id="star1"><label for="star1">&#9733;</label>
            </div>

            <form>
                <div class="form-group">
                    <label>Full Name:</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Food Quality:</label>
                    <select name="quality" required>
                        <option value="Excellent">Excellent</option>
                        <option value="Good">Good</option>
                        <option value="Average">Average</option>
                        <option value="Poor">Poor</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Feedback / Suggestions:</label>
                    <textarea name="feedback" rows="4" placeholder="Write your feedback here..."></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Submit Feedback</button>
            </form>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.querySelector("form");
        const ratingInputs = document.querySelectorAll("input[name='rating']");
        
        form.addEventListener("submit", (e) => {
            e.preventDefault(); 
            
            let ratingValue = "";
            ratingInputs.forEach(input => {
                if (input.checked) ratingValue = input.id.replace("star", "");
            });

            if (ratingValue === "") {
                alert("Please select a star rating!");
                return;
            }

            const feedbackData = {
                name: form.name.value.trim(),
                email: form.email.value.trim(),
                quality: form.quality.value,
                feedback: form.feedback.value.trim(),
                rating: parseInt(ratingValue)
            };

            // Simulate backend submission for purely frontend behavior
            setTimeout(() => {
                alert("Thank you! Your feedback has been submitted 😊");
                form.reset();
                setTimeout(() => { window.location.href = "index.html"; }, 100);
            }, 500);
        });
    });
    </script>
</body>
</html>
